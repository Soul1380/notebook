name: Build and publish Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Check version and existing release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=(Get-Content -Raw version.json | ConvertFrom-Json).version
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'version.json must contain a version such as 1.0.0' }
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { "publish=false" >> $env:GITHUB_OUTPUT } else { "publish=true" >> $env:GITHUB_OUTPUT }
          exit 0
      - name: Build installer
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          ./packaging/Build.ps1 -NodePath (Get-Command node).Source -StagePath "$PWD/build/stage" -InstallerPath "$PWD/build/HandwritingNotebookSetup.exe"
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$env:RELEASE_TAG" build/HandwritingNotebookSetup.exe build/HandwritingNotebook-update.zip --target "$env:GITHUB_SHA" --title "Handwriting Notebook $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
