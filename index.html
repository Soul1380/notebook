<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>手写笔记本</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:#f4f2ed;color:#272923}.top{position:absolute;top:0;left:0;right:0;height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #e8e7e2;z-index:2}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:12px;background:#263f35;color:white;display:grid;place-items:center;font-size:21px}.brand strong{font-size:16px;display:block}.brand small{color:#999e95;font-size:11px;letter-spacing:.12em}.tools{display:flex;align-items:center;gap:17px}.pen{background:#eef3ef;color:#294c3a;border-radius:10px;padding:10px 14px;font-size:13px}.divider{height:28px;width:1px;background:#e9e9e5}.colors{display:flex;gap:9px;align-items:center}.color{width:25px;height:25px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #d9dcd6;cursor:pointer}.color.active{box-shadow:0 0 0 2px #76957e}.save{border:0;background:#263f35;color:white;border-radius:10px;padding:12px 19px;font-size:13px;cursor:pointer}.save:hover{background:#355847}.workspace{position:absolute;inset:76px 0 0;overflow:hidden;touch-action:none;cursor:crosshair;background-color:#faf9f6;background-image:radial-gradient(#d8ded5 1px,transparent 1px);background-size:24px 24px}canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#fffefa;border:1px solid #e9e9e2;border-radius:30px;padding:10px 18px;color:#8a9087;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 18px #3940390a}.status{position:absolute;bottom:28px;right:28px;color:#a1a69d;font-size:12px;pointer-events:none}@media(max-width:600px){.top{padding:0 14px}.brand small,.pen,.divider,.status{display:none}.tools{gap:10px}.colors{gap:4px}.color{width:23px;height:23px}.save{padding:10px}.hint{font-size:11px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">✎</div><div><strong>手写笔记本</strong><small>YOUR LITTLE NOTEBOOK</small></div></div><div class="tools"><span class="pen">✎ &nbsp;画笔</span><span class="divider"></span><div class="colors" aria-label="画笔颜色"><button class="color active" style="background:#26342f" data-color="#26342f" aria-label="黑色"></button><button class="color" style="background:#bc5e52" data-color="#bc5e52" aria-label="红色"></button><button class="color" style="background:#cf9a4e" data-color="#cf9a4e" aria-label="黄色"></button><button class="color" style="background:#65866f" data-color="#65866f" aria-label="绿色"></button><button class="color" style="background:#7186a9" data-color="#7186a9" aria-label="蓝色"></button></div><span class="divider"></span><button class="save" id="save">↓ &nbsp;保存 PNG</button></div></header>
<main class="workspace" id="workspace"><canvas id="canvas"></canvas><div class="hint">在空白处按住拖动移动画布 · 按住笔迹开始书写</div><span class="status">自动保存在此浏览器</span></main>
<script>
(()=>{'use strict';const canvas=document.querySelector('#canvas'),area=document.querySelector('#workspace'),ctx=canvas.getContext('2d');let strokes=[];try{const stored=JSON.parse(localStorage.getItem('notebook-strokes-v1')||'[]');if(Array.isArray(stored))strokes=stored}catch(e){}let color='#26342f',view={x:0,y:0},action=null;const width=3;
function resize(){const d=window.devicePixelRatio||1;canvas.width=Math.round(area.clientWidth*d);canvas.height=Math.round(area.clientHeight*d);ctx.setTransform(d,0,0,d,0,0);draw()}function render(c,s,ox,oy){c.strokeStyle=s.color;c.fillStyle=s.color;c.lineWidth=s.width;c.lineCap='round';c.lineJoin='round';let p=s.points;if(!p.length)return;if(p.length===1){c.beginPath();c.arc(p[0].x+ox,p[0].y+oy,s.width/2,0,Math.PI*2);c.fill();return}c.beginPath();c.moveTo(p[0].x+ox,p[0].y+oy);for(let i=1;i<p.length;i++)c.lineTo(p[i].x+ox,p[i].y+oy);c.stroke()}function draw(){ctx.clearRect(0,0,area.clientWidth,area.clientHeight);for(const s of strokes)render(ctx,s,view.x,view.y)}function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left-view.x,y:e.clientY-r.top-view.y}}function near(p){for(const s of strokes){for(let i=0;i<s.points.length;i++){const a=s.points[i],b=s.points[i+1]||a,dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));if(Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)<12)return true}}return false}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;canvas.setPointerCapture(e.pointerId);const p=point(e);action={startX:e.clientX,startY:e.clientY,oldX:view.x,oldY:view.y,point:p,moved:false,mode:near(p)?'draw':'pending',pointerId:e.pointerId};if(action.mode==='draw'){action.stroke={color,width,points:[p]};strokes.push(action.stroke);draw()}});canvas.addEventListener('pointermove',e=>{if(!action||e.pointerId!==action.pointerId)return;const dist=Math.hypot(e.clientX-action.startX,e.clientY-action.startY);if(action.mode==='pending'&&dist>3){action.mode='pan';area.style.cursor='grabbing'}if(action.mode==='pan'){view.x=action.oldX+e.clientX-action.startX;view.y=action.oldY+e.clientY-action.startY;draw()}else if(action.mode==='draw'){action.stroke.points.push(point(e));draw()}});function end(e){if(!action||e.pointerId!==action.pointerId)return;if(action.mode==='pending'){strokes.push({color,width,points:[action.point]});draw()}try{localStorage.setItem('notebook-strokes-v1',JSON.stringify(strokes))}catch(err){alert('浏览器本地存储空间不足，请及时保存 PNG。')}action=null;area.style.cursor='crosshair'}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
document.querySelectorAll('.color').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.color;document.querySelectorAll('.color').forEach(x=>x.classList.toggle('active',x===b))}));document.querySelector('#save').addEventListener('click',()=>{if(!strokes.length){alert('先写点内容，再保存吧。');return}let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const s of strokes)for(const p of s.points){minX=Math.min(minX,p.x-s.width/2);minY=Math.min(minY,p.y-s.width/2);maxX=Math.max(maxX,p.x+s.width/2);maxY=Math.max(maxY,p.y+s.width/2)}const bleed=96/254;const left=Math.floor(minX-bleed),top=Math.floor(minY-bleed),w=Math.max(1,Math.ceil(maxX+bleed)-left),h=Math.max(1,Math.ceil(maxY+bleed)-top);if(w*h>100000000||w>32767||h>32767){alert('笔迹范围太大，无法导出图片。');return}const out=document.createElement('canvas');out.width=w;out.height=h;const c=out.getContext('2d');c.fillStyle='#ffffff';c.fillRect(0,0,w,h);for(const s of strokes)render(c,s,-left,-top);out.toBlob(blob=>{if(!blob){alert('保存失败，请重试。');return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='手写笔记.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')});window.addEventListener('resize',resize);resize()})();
</script></body></html>
