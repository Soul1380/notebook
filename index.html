<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notebook - 手写笔记本</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:#f4f2ed;color:#272923}.top{position:absolute;top:0;left:0;right:0;height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #e8e7e2;z-index:2}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:12px;background:#263f35;color:white;display:grid;place-items:center;font-size:21px}.brand strong{font-size:16px;display:block}.brand small{color:#999e95;font-size:11px;letter-spacing:.12em}.tools{display:flex;align-items:center;gap:17px}.pen{border:0;cursor:pointer;background:#eef3ef;color:#294c3a;border-radius:10px;padding:10px 14px;font-size:13px}.pen:not(.active){background:#f5f5f2;color:#626a63}.divider{height:28px;width:1px;background:#e9e9e5}.colors{display:flex;gap:9px;align-items:center}.color{width:25px;height:25px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #d9dcd6;cursor:pointer}.color.active{box-shadow:0 0 0 2px #76957e}.save{border:0;background:#263f35;color:white;border-radius:10px;padding:12px 19px;font-size:13px;cursor:pointer}.save:hover{background:#355847}.workspace{position:absolute;inset:76px 0 0;overflow:hidden;touch-action:none;cursor:crosshair;background-color:#faf9f6;background-image:radial-gradient(#d8ded5 1px,transparent 1px);background-size:24px 24px}canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#fffefa;border:1px solid #e9e9e2;border-radius:30px;padding:10px 18px;color:#8a9087;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 18px #3940390a}.status{position:absolute;bottom:28px;right:28px;color:#a1a69d;font-size:12px;pointer-events:none}@media(max-width:600px){.top{padding:0 14px}.brand small,.divider,.status{display:none}.tools{gap:10px}.colors{gap:4px}.color{width:23px;height:23px}.save{padding:10px}.hint{font-size:11px}}
.extra{display:flex;align-items:center;gap:7px}select,input,dialog button{font:inherit}select{border:1px solid #ddd;border-radius:8px;padding:8px;background:white}dialog{border:0;border-radius:16px;padding:24px;box-shadow:0 12px 60px #0003;max-width:90vw}dialog::backdrop{background:#0006}.prefrow{display:flex;align-items:center;justify-content:space-between;gap:28px;margin:14px 0}.prefrow input[type=text]{width:140px;border:1px solid #ddd;padding:8px;border-radius:8px}.top{height:auto;min-height:76px;flex-wrap:wrap;gap:8px;padding-block:10px}.tools{flex-wrap:wrap;gap:8px}.workspace{top:100px}@media(max-width:800px){.workspace{top:150px}.hint{max-width:95%;overflow:hidden}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">✎</div><div><strong>手写笔记本</strong><small>YOUR LITTLE NOTEBOOK</small></div></div><div class="tools"><button class="pen active" id="pen">✎ 画笔</button><button class="pen" id="eraser">▱ 擦除</button><button class="pen" id="undo" title="Ctrl+Z">↶ 撤回</button><span class="extra"><select id="shape" aria-label="图形工具"><option value="">图形</option><option value="line">直线</option><option value="rect">长方形</option><option value="square">正方形</option><option value="ellipse">椭圆</option><option value="circle">圆形</option><option value="triangle">三角形</option></select><label>擦除 <input id="size" type="range" min="4" max="100" value="24" aria-label="擦除范围"><span id="sizeValue">24</span></label><button class="pen" id="prefs">⚙ 首选项</button><button class="pen" id="fullscreen">全屏</button><button class="pen desktop" data-window="minimize">最小化</button><button class="pen desktop" data-window="maximize">最大化</button><button class="pen desktop" data-window="pin">置顶</button></span><span class="divider"></span><div class="colors" aria-label="画笔颜色"><button class="color active" style="background:#26342f" data-color="#26342f" aria-label="黑色"></button><button class="color" style="background:#bc5e52" data-color="#bc5e52" aria-label="红色"></button><button class="color" style="background:#cf9a4e" data-color="#cf9a4e" aria-label="黄色"></button><button class="color" style="background:#65866f" data-color="#65866f" aria-label="绿色"></button><button class="color" style="background:#7186a9" data-color="#7186a9" aria-label="蓝色"></button></div><span class="divider"></span><button class="save" id="save">↓ &nbsp;保存 PNG</button></div></header>
<main class="workspace" id="workspace"><canvas id="canvas"></canvas><div class="hint">拖动书写 · 按住 Shift 画直线 · 空白处长按后拖动移动</div><span class="status">自动保存在此浏览器</span></main>
<dialog id="preferences"><h2>首选项</h2><p>点击输入框并按下想要的快捷键。直线修饰键单独设置。</p><div id="shortcutRows"></div><div class="prefrow"><span>直线修饰键</span><select id="straightKey"><option value="Shift">Shift</option><option value="Alt">Alt</option><option value="Control">Ctrl</option></select></div><button id="resetShortcuts">恢复默认</button> <button id="closePrefs">完成</button></dialog><script>
(()=>{'use strict';const canvas=document.querySelector('#canvas'),area=document.querySelector('#workspace'),ctx=canvas.getContext('2d');let strokes=[];try{const stored=JSON.parse(localStorage.getItem('notebook-strokes-v1')||'[]');if(Array.isArray(stored))strokes=stored}catch(e){}let color='#26342f',view={x:0,y:0},action=null,tool='pen',history=[];const width=3;function snapshot(){history.push(JSON.stringify(strokes));if(history.length>100)history.shift()}function persist(){try{localStorage.setItem('notebook-strokes-v1',JSON.stringify(strokes))}catch(err){alert('浏览器本地存储空间不足，请及时保存 PNG。')}}function undo(){if(action||!history.length)return;strokes=JSON.parse(history.pop());persist();draw()}let eraserSize=24;function erase(p){const result=[];for(const s of strokes){let run=[];const flush=()=>{if(run.length)result.push({...s,points:run});run=[]};const add=q=>{if(Math.hypot(q.x-p.x,q.y-p.y)<=eraserSize/2+s.width/2)flush();else run.push(q)};if(s.points.length===1)add(s.points[0]);else for(let i=0;i<s.points.length-1;i++){const x=s.points[i],y=s.points[i+1],n=Math.max(1,Math.ceil(Math.hypot(y.x-x.x,y.y-x.y)));for(let j=i?1:0;j<=n;j++)add({x:x.x+(y.x-x.x)*j/n,y:x.y+(y.y-x.y)*j/n})}flush()}strokes=result;draw()}
function shapePoints(kind,a,b,center){if(center){b={x:a.x+(b.x-a.x),y:a.y+(b.y-a.y)};a={x:2*a.x-b.x,y:2*a.y-b.y}}let dx=b.x-a.x,dy=b.y-a.y;if(kind==='square'||kind==='circle'){const d=Math.max(Math.abs(dx),Math.abs(dy));dx=(dx<0?-1:1)*d;dy=(dy<0?-1:1)*d}const x=a.x+dx,y=a.y+dy;if(kind==='line')return [a,b];if(kind==='rect'||kind==='square')return [a,{x,y:a.y},{x,y},{x:a.x,y},a];if(kind==='triangle')return [{x:a.x+dx/2,y:a.y},{x,y},{x:a.x,y}, {x:a.x+dx/2,y:a.y}];let pts=[];for(let i=0;i<=100;i++){let t=i*Math.PI*2/100;pts.push({x:a.x+dx/2+dx/2*Math.cos(t),y:a.y+dy/2+dy/2*Math.sin(t)})}return pts}

function resize(){const d=window.devicePixelRatio||1;canvas.width=Math.round(area.clientWidth*d);canvas.height=Math.round(area.clientHeight*d);ctx.setTransform(d,0,0,d,0,0);draw()}function render(c,s,ox,oy){c.strokeStyle=s.color;c.fillStyle=s.color;c.lineWidth=s.width;c.lineCap='round';c.lineJoin='round';let p=s.points;if(!p.length)return;if(p.length===1){c.beginPath();c.arc(p[0].x+ox,p[0].y+oy,s.width/2,0,Math.PI*2);c.fill();return}c.beginPath();c.moveTo(p[0].x+ox,p[0].y+oy);for(let i=1;i<p.length;i++)c.lineTo(p[i].x+ox,p[i].y+oy);c.stroke()}function draw(){ctx.clearRect(0,0,area.clientWidth,area.clientHeight);for(const s of strokes)render(ctx,s,view.x,view.y)}function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left-view.x,y:e.clientY-r.top-view.y}}function near(p){for(const s of strokes){for(let i=0;i<s.points.length;i++){const a=s.points[i],b=s.points[i+1]||a,dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));if(Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)<12)return true}}return false}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0||action)return;canvas.setPointerCapture(e.pointerId);const p=point(e);action={startX:e.clientX,startY:e.clientY,oldX:view.x,oldY:view.y,point:p,mode:tool==='eraser'?'erase':tool==='pen'?'pending':'shape',started:Date.now(),pointerId:e.pointerId,straight:e.getModifierState(straightKey)};if(action.mode==='erase'){snapshot();erase(p)}else if(action.mode==='shape'){snapshot();action.stroke={color,width,points:[p]};strokes.push(action.stroke)}});
canvas.addEventListener('pointermove',e=>{if(!action||e.pointerId!==action.pointerId)return;const dist=Math.hypot(e.clientX-action.startX,e.clientY-action.startY);if(action.mode==='pending'&&dist>3){if(Date.now()-action.started>=350&&!near(action.point)&&!action.straight){action.mode='pan';area.style.cursor='grabbing'}else{action.mode='draw';snapshot();action.stroke={color,width,points:[action.point]};strokes.push(action.stroke)}}if(action.mode==='pan'){view.x=action.oldX+e.clientX-action.startX;view.y=action.oldY+e.clientY-action.startY;draw()}else if(action.mode==='erase'){const p=point(e),last=action.last||action.point,steps=Math.ceil(Math.hypot(p.x-last.x,p.y-last.y)/6);for(let i=1;i<=steps;i++)erase({x:last.x+(p.x-last.x)*i/steps,y:last.y+(p.y-last.y)*i/steps});action.last=p}else if(action.mode==='shape'){action.stroke.points=shapePoints(tool,action.point,point(e),e.shiftKey);draw()}else if(action.mode==='draw'){if(action.straight||e.getModifierState(straightKey))action.stroke.points=[action.point,point(e)];else action.stroke.points.push(point(e));draw()}});
function end(e){if(!action||e.pointerId!==action.pointerId)return;if(action.mode==='pending'){snapshot();strokes.push({color,width,points:[action.point]});draw()}if(action.mode!=='pan')persist();action=null;area.style.cursor='crosshair'}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
function selectTool(name){tool=name;document.querySelector('#shape').value=['line','rect','square','ellipse','circle','triangle'].includes(name)?name:'';document.querySelector('#pen').classList.toggle('active',name==='pen');document.querySelector('#eraser').classList.toggle('active',name==='eraser')}document.querySelector('#pen').addEventListener('click',()=>selectTool('pen'));document.querySelector('#eraser').addEventListener('click',()=>selectTool('eraser'));document.querySelector('#undo').addEventListener('click',undo);const defaults={pen:'P',eraser:'E',undo:'Ctrl+Z',save:'Ctrl+S'};let shortcuts={...defaults},straightKey='Shift';try{const saved=JSON.parse(localStorage.getItem('notebook-preferences')||'{}');shortcuts={...defaults,...saved.shortcuts};straightKey=saved.straightKey||'Shift';eraserSize=Math.min(100,Math.max(4,saved.eraserSize||24))}catch(e){}const prefs=document.querySelector('#preferences'),rows=document.querySelector('#shortcutRows'),size=document.querySelector('#size');size.value=eraserSize;document.querySelector('#sizeValue').textContent=eraserSize;function savePrefs(){localStorage.setItem('notebook-preferences',JSON.stringify({shortcuts,straightKey,eraserSize}))}size.oninput=()=>{eraserSize=+size.value;document.querySelector('#sizeValue').textContent=eraserSize;savePrefs()};document.querySelector('#shape').onchange=e=>{if(e.target.value)selectTool(e.target.value)};function keyName(e){let k=e.key;if(['Control','Alt','Shift','Meta'].includes(k))return '';return [e.ctrlKey?'Ctrl':'',e.altKey?'Alt':'',e.shiftKey?'Shift':'',e.metaKey?'Meta':'',k.length===1?k.toUpperCase():k].filter(Boolean).join('+')}function prefRows(){rows.innerHTML='';for(const [id,label] of Object.entries({pen:'画笔',eraser:'擦除',undo:'撤回',save:'保存 PNG'})){let row=document.createElement('label');row.className='prefrow';let title=document.createElement('span');title.textContent=label;let input=document.createElement('input');input.type='text';input.readOnly=true;input.value=shortcuts[id];input.setAttribute('aria-label',label+'快捷键');input.addEventListener('keydown',e=>{e.preventDefault();e.stopPropagation();let key=keyName(e);if(!key)return;if(Object.entries(shortcuts).some(([other,v])=>other!==id&&v===key)){alert('该快捷键已被使用，请选择其他按键。');return}shortcuts[id]=key;input.value=key;savePrefs()});row.append(title,input);rows.append(row)}document.querySelector('#straightKey').value=straightKey}document.querySelector('#prefs').onclick=()=>{prefRows();prefs.showModal()};document.querySelector('#closePrefs').onclick=()=>prefs.close();document.querySelector('#resetShortcuts').onclick=()=>{shortcuts={...defaults};straightKey='Shift';savePrefs();prefRows()};document.querySelector('#straightKey').onchange=e=>{straightKey=e.target.value;savePrefs()};window.addEventListener('keydown',e=>{if(prefs.open||e.target.matches('input,select,textarea'))return;const key=keyName(e);const id=Object.keys(shortcuts).find(k=>shortcuts[k]===key);if(!id)return;e.preventDefault();if(id==='undo')undo();else if(id==='save')document.querySelector('#save').click();else selectTool(id)});
document.querySelector('#fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};document.querySelectorAll('.desktop').forEach(b=>{if(location.protocol==='file:'){b.disabled=true;b.title='请使用桌面版启动器'}else b.onclick=async()=>{const res=await fetch('/window/'+b.dataset.window,{method:'POST',headers:{'X-Notebook-Token':new URLSearchParams(location.search).get('token')}});const data=await res.json();if(!data.ok)alert('窗口操作失败：'+(data.error||'请重试'));if(b.dataset.window==='pin'&&data.ok)b.textContent=data.pinned?'取消置顶':'置顶'}});document.querySelectorAll('.color').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.color;document.querySelectorAll('.color').forEach(x=>x.classList.toggle('active',x===b))}));document.querySelector('#save').addEventListener('click',()=>{if(!strokes.length){alert('先写点内容，再保存吧。');return}let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const s of strokes)for(const p of s.points){minX=Math.min(minX,p.x-s.width/2);minY=Math.min(minY,p.y-s.width/2);maxX=Math.max(maxX,p.x+s.width/2);maxY=Math.max(maxY,p.y+s.width/2)}const bleed=96/254;const left=Math.floor(minX-bleed),top=Math.floor(minY-bleed),w=Math.max(1,Math.ceil(maxX+bleed)-left),h=Math.max(1,Math.ceil(maxY+bleed)-top);if(w*h>100000000||w>32767||h>32767){alert('笔迹范围太大，无法导出图片。');return}const out=document.createElement('canvas');out.width=w;out.height=h;const c=out.getContext('2d');c.fillStyle='#ffffff';c.fillRect(0,0,w,h);for(const s of strokes)render(c,s,-left,-top);out.toBlob(blob=>{if(!blob){alert('保存失败，请重试。');return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='手写笔记.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')});window.addEventListener('resize',resize);resize()})();
</script></body></html>
