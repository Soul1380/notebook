<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notebook - 手写笔记本</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:#f4f2ed;color:#272923}.top{position:absolute;top:0;left:0;right:0;height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #e8e7e2;z-index:2}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:12px;background:#263f35;color:white;display:grid;place-items:center;font-size:21px}.brand strong{font-size:16px;display:block}.brand small{color:#999e95;font-size:11px;letter-spacing:.12em}.tools{display:flex;align-items:center;gap:17px}.pen{border:0;cursor:pointer;background:#eef3ef;color:#294c3a;border-radius:10px;padding:10px 14px;font-size:13px}.pen:not(.active){background:#f5f5f2;color:#626a63}.divider{height:28px;width:1px;background:#e9e9e5}.colors{display:flex;gap:9px;align-items:center}.color{width:25px;height:25px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #d9dcd6;cursor:pointer}.color.active{box-shadow:0 0 0 2px #76957e}.save{border:0;background:#263f35;color:white;border-radius:10px;padding:12px 19px;font-size:13px;cursor:pointer}.save:hover{background:#355847}.workspace{position:absolute;inset:76px 0 0;overflow:hidden;touch-action:none;cursor:crosshair;background-color:#faf9f6;background-image:radial-gradient(#d8ded5 1px,transparent 1px);background-size:24px 24px}canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#fffefa;border:1px solid #e9e9e2;border-radius:30px;padding:10px 18px;color:#8a9087;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 18px #3940390a}.status{position:absolute;bottom:28px;right:28px;color:#a1a69d;font-size:12px;pointer-events:none}@media(max-width:600px){.top{padding:0 14px}.brand small,.divider,.status{display:none}.tools{gap:10px}.colors{gap:4px}.color{width:23px;height:23px}.save{padding:10px}.hint{font-size:11px}}
.extra{display:flex;align-items:center;gap:7px}select,input,dialog button{font:inherit}select{border:1px solid #ddd;border-radius:8px;padding:8px;background:white}dialog{border:0;border-radius:16px;padding:24px;box-shadow:0 12px 60px #0003;max-width:90vw}dialog::backdrop{background:#0006}.prefrow{display:flex;align-items:center;justify-content:space-between;gap:28px;margin:14px 0}.prefrow input[type=text]{width:140px;border:1px solid #ddd;padding:8px;border-radius:8px}.top{height:auto;min-height:76px;flex-wrap:wrap;gap:8px;padding-block:10px}.tools{flex-wrap:wrap;gap:8px}.workspace{top:100px}@media(max-width:800px){.workspace{top:150px}.hint{max-width:95%;overflow:hidden}}
.top{height:112px;min-height:0;display:flex;flex-wrap:nowrap;align-items:center;padding:10px 16px;gap:18px}.brand{flex:none}.tools{min-width:0;flex:1;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;align-items:stretch;padding:2px 2px 8px;gap:8px;scrollbar-width:thin}.toolbox{display:flex;align-items:center;gap:7px;flex:none;border:1px solid #e7ebe5;border-radius:12px;padding:8px;white-space:nowrap;min-width:0}.toolbox>*{flex-shrink:0}.group-title{font-size:11px;color:#959e93;padding:0 3px}.size-control{display:flex;align-items:center;gap:3px;font-size:12px;color:#626a63}.size-control input{width:75px}.workspace{top:112px}@media(max-width:600px){.top{height:94px;padding:8px}.brand{gap:0}.brand>div:last-child{display:none}.tools{gap:6px}.toolbox{padding:6px}.workspace{top:94px}.hint{max-width:95%;overflow:hidden}}
.top{overflow:hidden}.tools{overflow:hidden;display:flex;flex-wrap:nowrap;align-items:stretch;gap:6px;padding:2px;min-width:0}.toolbox{flex:1 1 0;min-width:0;max-width:none;overflow:hidden;padding:6px;gap:4px}.toolbox:first-child{flex:2 1 0}.group-items{flex:1 1 0;min-width:0;display:flex;gap:7px;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding:2px 2px 7px}.group-items>*{flex:0 0 auto}.group-title{flex:0 0 auto}.colors{flex:0 0 auto}.toolbox .group-items::-webkit-scrollbar{height:5px}.toolbox .group-items::-webkit-scrollbar-thumb{background:#bac7ba;border-radius:4px}@media(max-width:600px){.top{height:150px;align-items:flex-start}.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));height:100%}.toolbox{min-height:0}.workspace{top:150px}}
@media(max-width:600px){.top{height:220px}.tools{grid-template-rows:repeat(3,minmax(0,1fr))}.workspace{top:220px}}.editor{position:absolute;box-sizing:border-box;resize:none;border:1px solid #76957e;background:#fff;color:#26342f;font-family:SimSun,"宋体",serif;padding:2px;line-height:1.4;overflow:auto;outline:none}
@media (prefers-reduced-motion: no-preference){.workspace,.top{animation:notebook-enter .18s ease-out both}@keyframes notebook-enter{from{opacity:0}to{opacity:1}}}
.top{position:absolute;display:flex;align-items:stretch;height:auto;min-height:0;padding:8px 16px;gap:14px;overflow:visible}.brand{align-self:center}.toolbar{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}.tabs{display:flex;flex-wrap:wrap;gap:4px}.tabs button{border:0;background:transparent;border-radius:7px;padding:5px 12px;color:#68766c;cursor:pointer}.tabs button[aria-selected=true]{background:#e4eee7;color:#264a36}.tools{display:block;overflow:visible;padding:0}.toolbox,.toolbox:first-child{display:block;padding:0;border:0;overflow:visible}.toolbox[hidden]{display:none}.group-title{display:none}.group-items{display:flex;flex-wrap:wrap;overflow:visible;padding:0;gap:6px}.workspace{top:var(--toolbar-height,112px)}.quick{position:absolute;z-index:10;width:min(340px,calc(100% - 16px));padding:14px;background:#fff;border:1px solid #d9e3da;border-radius:12px;box-shadow:0 8px 30px #0002}.quick[hidden]{display:none}.quick textarea{display:block;width:100%;height:75px;margin:8px 0;padding:8px;resize:vertical}.quick small{display:block;margin-top:8px;color:#78827a}@media(max-width:600px){.top{height:auto;display:flex;padding:8px}.tools{display:block;height:auto}.workspace{top:var(--toolbar-height,140px)}.brand{align-self:flex-start}.tabs button{padding:5px 8px}}
.workspace{left:64px}.taskbar{position:absolute;left:0;top:var(--toolbar-height,112px);bottom:0;width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;background:#fff;border-right:1px solid #e7ebe5;overflow-y:auto;z-index:1;scrollbar-width:thin}#taskList{flex:0 0 auto}.taskbar-title{font-size:10px;color:#89948b}.task-item{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;cursor:pointer;color:#587062;font-size:20px}.task-item:hover,.task-item:focus-visible{background:#edf3ee;outline:none}.task-item img{width:32px;height:32px;object-fit:contain}.task-info{font-size:10px;text-align:center;color:#96a199;overflow-wrap:anywhere}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">✎</div><div><strong>手写笔记本</strong><small>YOUR LITTLE NOTEBOOK</small></div></div><div class="toolbar"><div class="tabs" role="tablist" aria-label="工具分类"></div><nav class="tools" aria-label="工具栏"><div class="toolbox"><span class="group-title">绘制</span><button class="pen active" id="pen">✎ 画笔</button><button class="pen" id="eraser">▱ 擦除</button><button class="pen" id="select">↖ 选择</button><button class="pen" id="textTool">T 文本框</button><button class="pen" id="undo" title="Ctrl+Z">↶ 撤回</button><select id="shape" aria-label="图形工具"><option value="">图形</option><option value="line">直线</option><option value="rect">长方形</option><option value="square">正方形</option><option value="ellipse">椭圆</option><option value="circle">圆形</option><option value="triangle">三角形</option></select><label class="size-control">范围 <input id="size" type="range" min="4" max="100" value="24" aria-label="擦除范围"><span id="sizeValue">24</span></label></div><div class="toolbox"><span class="group-title">颜色</span><div class="colors" aria-label="画笔颜色"><button class="color active" style="background:#26342f" data-color="#26342f" aria-label="黑色"></button><button class="color" style="background:#bc5e52" data-color="#bc5e52" aria-label="红色"></button><button class="color" style="background:#cf9a4e" data-color="#cf9a4e" aria-label="黄色"></button><button class="color" style="background:#65866f" data-color="#65866f" aria-label="绿色"></button><button class="color" style="background:#7186a9" data-color="#7186a9" aria-label="蓝色"></button></div></div><div class="toolbox"><span class="group-title">图片</span><button class="pen" id="insertImage">插入图片</button><input type="file" id="imageFile" accept="image/*" hidden><button class="pen" id="smaller">缩小</button><button class="pen" id="larger">放大</button><button class="pen" id="deleteObject">删除</button></div><div class="toolbox"><span class="group-title">文件</span><button class="pen" id="newProject">新建</button><button class="pen" id="openProject">打开工程</button><button class="pen" id="recover">恢复上次画布</button><button class="pen" id="saveProject">保存工程</button><input type="file" id="projectFile" accept=".notebook,.json,application/json" hidden><button class="save" id="save">↓ 保存 PNG</button></div><div class="toolbox"><span class="group-title">窗口</span><button class="pen" id="prefs">⚙ 首选项</button><button class="pen" id="fullscreen">全屏</button><button class="pen desktop" data-window="minimize">最小化</button><button class="pen desktop" data-window="maximize">最大化</button><button class="pen desktop" data-window="pin">置顶</button></div></nav></div></header>
<aside class="taskbar" aria-label="运行窗口"><span class="taskbar-title">运行中</span><div id="taskList"></div><span class="task-info" id="taskInfo"></span></aside><main class="workspace" id="workspace"><canvas id="canvas"></canvas><div class="hint">滚轮缩放 · Ctrl+V 粘贴图片 · 选择后拖动对象</div><span class="status">本次画布自动备份</span><div class="quick" id="quick" hidden><strong>快捷查询</strong><textarea id="query" placeholder="输入查询内容" aria-label="查询内容"></textarea><div><button class="pen" id="baidu">百度搜索</button><button class="pen" id="askChat">复制并打开 ChatGPT</button><button class="pen" id="closeQuick">关闭</button></div><small>ChatGPT 中选择相应聊天后粘贴问题。</small></div></main>
<dialog id="preferences"><h2>首选项</h2><p>点击输入框并按下想要的快捷键。直线修饰键单独设置。</p><div id="shortcutRows"></div><div class="prefrow"><span>直线修饰键</span><select id="straightKey"><option value="Shift">Shift</option><option value="Alt">Alt</option><option value="Control">Ctrl</option></select></div><div class="prefrow"><span>工程保存目录</span><button id="chooseFolder">选择文件夹</button><button id="clearFolder">使用默认下载位置</button><span id="folderName">默认下载位置</span></div><button id="resetShortcuts">恢复默认</button> <button id="closePrefs">完成</button></dialog><script src="app.js"></script></body></html>
