<body><div id="splash" class="splash" role="status" aria-live="polite"><div class="splash-card"><div class="splash-logo">✎</div><h1>手写笔记本</h1><div class="splash-sub">YOUR LITTLE NOTEBOOK</div><div class="progress-track"><div class="progress-fill" id="loadBar"></div></div><div class="splash-status" id="loadStatus">正在准备界面…</div></div></div>
<header class="top"><div class="brand"><div class="logo">✎</div><div><strong>手写笔记本</strong><small>YOUR LITTLE NOTEBOOK</small></div></div><div class="toolbar"><div class="tabs" role="tablist" aria-label="工具分类"></div><nav class="tools" aria-label="工具栏"><div class="toolbox"><span class="group-title">绘制</span><button class="pen active" id="pen">✎ 画笔</button><button class="pen" id="eraser">▱ 擦除</button><button class="pen" id="select">↖ 选择</button><button class="pen" id="textTool">T 文本框</button><button class="pen" id="undo" title="Ctrl+Z">↶ 撤回</button><select id="shape" aria-label="图形工具"><option value="">图形</option><option value="line">直线</option><option value="rect">长方形</option><option value="square">正方形</option><option value="ellipse">椭圆</option><option value="circle">圆形</option><option value="triangle">三角形</option></select><label class="size-control">范围 <input id="size" type="range" min="4" max="100" value="24" aria-label="擦除范围"><span id="sizeValue">24</span></label></div><div class="toolbox"><span class="group-title">颜色</span><div class="color-panel"><div class="color-block"><span>固定颜色</span><div class="colors" aria-label="画笔颜色"><button class="color active" style="background:#26342f" data-color="#26342f" aria-label="固定颜色 #26342f"></button><button class="color" style="background:#bd4f48" data-color="#bd4f48" aria-label="固定颜色 #bd4f48"></button><button class="color" style="background:#ed7867" data-color="#ed7867" aria-label="固定颜色 #ed7867"></button><button class="color" style="background:#db9c46" data-color="#db9c46" aria-label="固定颜色 #db9c46"></button><button class="color" style="background:#ebc854" data-color="#ebc854" aria-label="固定颜色 #ebc854"></button><button class="color" style="background:#98a54f" data-color="#98a54f" aria-label="固定颜色 #98a54f"></button><button class="color" style="background:#638b6d" data-color="#638b6d" aria-label="固定颜色 #638b6d"></button><button class="color" style="background:#3d9990" data-color="#3d9990" aria-label="固定颜色 #3d9990"></button><button class="color" style="background:#4d8dbe" data-color="#4d8dbe" aria-label="固定颜色 #4d8dbe"></button><button class="color" style="background:#5069a1" data-color="#5069a1" aria-label="固定颜色 #5069a1"></button><button class="color" style="background:#7e65a6" data-color="#7e65a6" aria-label="固定颜色 #7e65a6"></button><button class="color" style="background:#b16c9a" data-color="#b16c9a" aria-label="固定颜色 #b16c9a"></button><button class="color" style="background:#915f4c" data-color="#915f4c" aria-label="固定颜色 #915f4c"></button><button class="color" style="background:#766b60" data-color="#766b60" aria-label="固定颜色 #766b60"></button><button class="color" style="background:#888d89" data-color="#888d89" aria-label="固定颜色 #888d89"></button><button class="color" style="background:#d2d5d0" data-color="#d2d5d0" aria-label="固定颜色 #d2d5d0"></button></div></div><div class="color-block"><span>色谱</span><div class="spectrum-block"><div class="hue-strip" id="spectrum" role="slider" tabindex="0" aria-label="色谱，双击打开颜色选择器" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0"><span class="hue-marker" id="spectrumMarker"></span></div><span class="spectrum-hint">拖动选色<br>双击精细调整</span><button class="pen" id="openColorPicker">精细选色</button></div></div><div class="color-block"><span>调整颜色</span><div class="color-sliders"><label>R <input type="range" id="colorR" min="0" max="255" value="38"><output id="valueR">38</output></label><label>G <input type="range" id="colorG" min="0" max="255" value="52"><output id="valueG">52</output></label><label>B <input type="range" id="colorB" min="0" max="255" value="47"><output id="valueB">47</output></label><label>明暗 <input type="range" id="brightness" min="0" max="200" value="100"><output id="valueBrightness">100%</output></label><label>不透明度 <input type="range" id="opacity" min="0" max="100" value="100"><output id="valueOpacity">100%</output></label><span class="color-preview" id="colorPreview" title="当前颜色"></span></div></div><div class="color-block"><span>最近使用</span><div class="colors" id="recentColors" aria-label="最近使用的颜色"></div></div></div></div><div class="toolbox"><span class="group-title">图片</span><button class="pen" id="insertImage">插入图片</button><input type="file" id="imageFile" accept="image/*" hidden><button class="pen" id="smaller">缩小</button><button class="pen" id="larger">放大</button><button class="pen" id="deleteObject">删除</button></div><div class="toolbox"><span class="group-title">文件</span><button class="pen" id="newProject">新建</button><button class="pen" id="openProject">打开工程</button><button class="pen" id="recover">恢复上次画布</button><button class="pen" id="saveProject">保存工程</button><input type="file" id="projectFile" accept=".notebook,.json,application/json" hidden><button class="save" id="save">↓ 保存 PNG</button></div><div class="toolbox"><span class="group-title">窗口</span><button class="pen" id="prefs">⚙ 首选项</button><button class="pen" id="fullscreen">全屏</button><button class="pen desktop" data-window="minimize">最小化</button><button class="pen desktop" data-window="maximize">最大化</button><button class="pen desktop" data-window="pin">置顶</button></div></nav></div></header>
<aside class="taskbar" aria-label="运行窗口"><span class="taskbar-title">运行中</span><div id="taskList"></div><span class="task-info" id="taskInfo"></span></aside><main class="workspace" id="workspace"><canvas id="canvas"></canvas><div id="radial" class="radial" hidden aria-label="右键轮盘"><div class="radial-center">拖动选择</div></div><div id="radialPanel" class="radial-panel" hidden><div class="radial-panel-head"><strong id="radialTitle"></strong><button class="radial-panel-close" id="radialClose" aria-label="关闭">×</button></div><div class="radial-actions" id="radialActions"></div></div><div class="hint">滚轮缩放 · Ctrl+V 粘贴图片 · 选择后拖动对象</div><span class="status">本次画布自动备份</span><div class="quick" id="quick" hidden><strong>快捷查询</strong><textarea id="query" placeholder="输入查询内容" aria-label="查询内容"></textarea><div><button class="pen" id="baidu">百度搜索</button><button class="pen" id="askChat">复制并打开 ChatGPT</button><button class="pen" id="closeQuick">关闭</button></div><small>ChatGPT 中选择相应聊天后粘贴问题。</small></div></main>
<dialog id="colorPicker" class="picker-dialog"><h2>选择颜色</h2><div class="picker-grid"><div id="svField" class="sv-field" role="slider" tabindex="0" aria-label="饱和度与亮度"><span class="sv-cursor" id="svCursor"></span></div><div class="hue-strip picker-hue" id="pickerHue" role="slider" tabindex="0" aria-label="颜色色相"><span class="hue-marker" id="pickerHueMarker"></span></div></div><div class="picker-values"><label>R <input type="number" id="pickerR" min="0" max="255"></label><label>G <input type="number" id="pickerG" min="0" max="255"></label><label>B <input type="number" id="pickerB" min="0" max="255"></label><span id="pickerSample" class="picker-sample" aria-label="颜色预览"></span></div><div class="picker-actions"><button class="pen" id="cancelColor">取消</button><button class="save" id="confirmColor">使用颜色</button></div></dialog><dialog id="preferences"><h2>首选项</h2><p>点击输入框并按下想要的快捷键。直线修饰键单独设置。</p><div id="shortcutRows"></div><div class="prefrow"><span>直线修饰键</span><select id="straightKey"><option value="Shift">Shift</option><option value="Alt">Alt</option><option value="Control">Ctrl</option></select></div><div class="prefrow"><span>工程保存目录</span><button id="chooseFolder">选择文件夹</button><button id="clearFolder">使用默认下载位置</button><span id="folderName">默认下载位置</span></div><button id="resetShortcuts">恢复默认</button> <button id="closePrefs">完成</button></dialog><script>window.notebookLoad=function(n,message){document.getElementById('loadBar').style.width=n+'%';document.getElementById('loadStatus').textContent=message};window.notebookLoad(30,'正在加载画板…');</script><script src="app.js" onerror="window.notebookLoad(30,'画板加载失败，请重新启动。')"></script></body></html>
